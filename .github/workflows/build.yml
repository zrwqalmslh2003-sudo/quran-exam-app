name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.3'

      - name: Generate Android project scaffold
        run: flutter create . --platforms=android --org com.qalon --project-name quran_exam_app
      - name: Apply app name and id
        run: |
          sed -i 's/android:label="quran_exam_app"/android:label="اختبارات قالون"/' android/app/src/main/AndroidManifest.xml
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/applicationId = "com.qalon.quran_exam_app"/applicationId = "com.qalon.exams"/' android/app/build.gradle.kts
          else
            sed -i 's/applicationId "com.qalon.quran_exam_app"/applicationId "com.qalon.exams"/' android/app/build.gradle
          fi
      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-exam-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/app/outputs/flutter-apk/app-release.apk